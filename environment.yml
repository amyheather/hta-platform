name: hta-platform

channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.11
  - pip

  # ---------------------------------------------------------------------
  # Core scientific / data stack (via conda for stable binary wheels)
  # ---------------------------------------------------------------------
  - pandas>=2.0,<3
  - openpyxl>=3.1,<4
  - lxml>=5.0,<6

  # ---------------------------------------------------------------------
  # Local dev / editor tooling
  # ---------------------------------------------------------------------
  - ipykernel>=6.29,<7
  - black>=24.0,<25
  - flake8>=7.0,<8

  # ---------------------------------------------------------------------
  # Remaining packages installed via pip (not all on conda-forge)
  # ---------------------------------------------------------------------
  - pip:
      - streamlit>=1.32,<2
      - requests>=2.31,<3
      - beautifulsoup4>=4.12,<5
      - pdfplumber>=0.11,<1
      - camelot-py>=0.11,<1
      - opencv-python>=4.9,<5
      - ghostscript>=0.7,<1
      - langchain>=0.2,<0.3
      - langchain-community>=0.2,<0.3
      - langchain-chroma>=0.1,<0.2
      - chromadb>=0.5,<0.6
      - sentence-transformers>=2.7,<3
      - transformers>=4.40,<5
      - torch>=2.2,<3
      - python-dotenv>=1.0,<2
