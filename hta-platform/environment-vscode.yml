# =============================================================================
# NICE HTA PLATFORM
# environment.yml  —  Local Development (VS Code)
# =============================================================================
# Create with:
#   conda env create -f environment-vscode.yml
#   conda activate nice-hta-platform-dev
#
# Then in VS Code: Ctrl/Cmd+Shift+P -> "Python: Select Interpreter"
# -> choose the "nice-hta-platform-dev" conda environment.
#
# System-level dependency (install BEFORE creating the env):
#   - macOS:   brew install ghostscript
#   - Ubuntu:  sudo apt-get install -y ghostscript
#   - Windows: install Ghostscript and add it to PATH
#
# Ollama must be installed and running separately (not a conda/pip package):
#   https://ollama.com/download
#   ollama pull llama3.1:8b
#   ollama serve
#
# NOTE ON camelot-py:
#   Installed WITHOUT the [base]/[all]/[cv] extras. Those extras pin their
#   own "opencv-python" dependency, which would install alongside the
#   "opencv-python" already pinned below under Local Dev stack (same
#   package here, so no conflict on VS Code) — but keeping camelot-py
#   bare and controlling ghostscript + opencv-python explicitly ourselves
#   keeps the VS Code and OpenStack environment files symmetric and
#   avoids relying on camelot's extras at all. Only the lattice/stream
#   flavors are used in this codebase (no camelot.plot(), no pdftopng),
#   so nothing functional is lost.
# =============================================================================

name: nice-hta-platform-dev

channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.11
  - pip

  # ---------------------------------------------------------------------
  # Core scientific / data stack (via conda for stable binary wheels)
  # ---------------------------------------------------------------------
  - pandas>=2.0,<3
  - openpyxl>=3.1,<4
  - lxml>=5.0,<6

  # ---------------------------------------------------------------------
  # Local dev / editor tooling
  # ---------------------------------------------------------------------
  - ipykernel>=6.29,<7
  - black>=24.0,<25
  - flake8>=7.0,<8

  # ---------------------------------------------------------------------
  # Remaining packages installed via pip (not all on conda-forge)
  # ---------------------------------------------------------------------
  - pip:
      - streamlit>=1.32,<2
      - requests>=2.31,<3
      - beautifulsoup4>=4.12,<5
      - pdfplumber>=0.11,<1
      - camelot-py>=0.11,<1
      - opencv-python>=4.9,<5
      - ghostscript>=0.7,<1
      - langchain>=0.2,<0.3
      - langchain-community>=0.2,<0.3
      - langchain-chroma>=0.1,<0.2
      - chromadb>=0.5,<0.6
      - sentence-transformers>=2.7,<3
      - transformers>=4.40,<5
      - torch>=2.2,<3
      - python-dotenv>=1.0,<2
