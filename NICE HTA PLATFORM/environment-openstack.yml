# =============================================================================
# NICE HTA PLATFORM
# environment.yml  —  Linux / OpenStack (headless server) deployment
# =============================================================================
# Create with:
#   conda env create -f environment-openstack.yml
#   conda activate nice-hta-platform
#
# System-level dependency (install BEFORE creating the env, via apt):
#   sudo apt-get update && sudo apt-get install -y ghostscript
#
# Ollama must be installed and running separately (not a conda/pip package):
#   curl -fsSL https://ollama.com/install.sh | sh
#   ollama pull llama3.1:8b
#   ollama serve
#
# NOTE ON camelot-py:
#   Installed WITHOUT the [base]/[all]/[cv] extras. Those extras hardcode
#   a dependency on plain "opencv-python" (the GUI build, which needs
#   libGL.so.1 and other X11 libraries not present on a headless server).
#   If installed alongside "opencv-python-headless" below, both packages
#   write into the same site-packages/cv2 folder and whichever installs
#   last silently wins — an install-order-dependent conflict that can
#   surface later as "ImportError: libGL.so.1: cannot open shared object
#   file" the first time table extraction is used. Keeping camelot-py
#   bare and pinning ghostscript + opencv-python-headless explicitly
#   avoids this entirely. Only the lattice/stream flavors are used in
#   this codebase (no camelot.plot(), no pdftopng), so nothing
#   functional is lost by omitting the extra.
# =============================================================================

name: nice-hta-platform

channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.11
  - pip

  # ---------------------------------------------------------------------
  # Core scientific / data stack (via conda for stable binary wheels)
  # ---------------------------------------------------------------------
  - pandas>=2.0,<3
  - openpyxl>=3.1,<4
  - lxml>=5.0,<6

  # ---------------------------------------------------------------------
  # Remaining packages installed via pip (not all on conda-forge)
  # ---------------------------------------------------------------------
  - pip:
      - streamlit>=1.32,<2
      - requests>=2.31,<3
      - beautifulsoup4>=4.12,<5
      - pdfplumber>=0.11,<1
      - camelot-py>=0.11,<1
      - opencv-python-headless>=4.9,<5
      - ghostscript>=0.7,<1
      - langchain>=0.2,<0.3
      - langchain-community>=0.2,<0.3
      - langchain-chroma>=0.1,<0.2
      - chromadb>=0.5,<0.6
      - sentence-transformers>=2.7,<3
      - transformers>=4.40,<5
      - torch>=2.2,<3
